kind = "web"
previewPath = "/"
title = "Security Operations Management"
description = "A two-module operations management app for security teams. It replaces the Security and Main Gate Security workbooks with searchable registers, structured entry forms, automatic calculations, dashboards, and printable records."
version = "1.0.0"
id = "artifacts/security-operations"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20169

[services.development]
run = "pnpm --filter @workspace/security-operations run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/security-operations", "run", "build" ]
serve = "static"
publicDir = "artifacts/security-operations/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20169"
BASE_PATH = "/"
